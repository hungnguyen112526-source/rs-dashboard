name: Cập nhật dữ liệu RS hàng ngày

on:
  schedule:
    # Chạy lúc 09:30 UTC = 16:30 (4h30 chiều) giờ Việt Nam, các ngày trong tuần (T2-T6)
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}  # cho phép bấm chạy tay từ tab Actions trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy script lấy dữ liệu
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python fetch_data.py

      - name: Sinh báo cáo HTML tĩnh
        run: python generate_report.py

      - name: Commit và push file dữ liệu + báo cáo mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gia_lich_su_rs.csv docs/index.html
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu RS tự động $(date +'%Y-%m-%d')"
          git push
