name: Cập nhật giá RS (TradingView + fhsc dự phòng - 6 lần/ngày T2-T6, chỉ phần đuôi)

# Giá lấy bằng TRADINGVIEW (tvdatafeed) là chính; mã nào TradingView lỗi/không khớp, hoặc mã mới chưa có lịch sử,
# thì dùng vnstock thế hệ 6 với nguồn fhsc (PRICE_SOURCE=auto). Cần Secret FHSC_API_KEY (khoá FHSC hết hạn sau 30 ngày,
# phải tạo lại và cập nhật Secret định kỳ). Thiếu khoá/không cài được vnstock 6 -> chỉ mất phần dự phòng.
# - Lấy toàn bộ lịch sử (15 lần/ngày, cả cuối tuần): update_data_full.yml
# - Vĩ mô + lãi suất trái phiếu: update_macro.yml
# - Giá bằng TradingView: update_data_tv.yml (Chủ nhật + thứ Hai)
# Các workflow giá cùng ghi gia_lich_su_rs.csv nên dùng chung nhóm concurrency "data-update" (chạy lần lượt, không chồng nhau;
# cũng đảm bảo không có 2 lần gọi nguồn giá song song làm bị giới hạn request).

on:
  schedule:
    # T2-T6, giờ VN (UTC+7) -> UTC. Lần giữa phiên chỉ có nến chưa chốt, sẽ được ghi đè ở lần chạy sau.
    # 09:30 VN
    - cron: "30 2 * * 1-5"
    # 11:35 VN
    - cron: "35 4 * * 1-5"
    # 13:30 VN
    - cron: "30 6 * * 1-5"
    # 14:35 VN
    - cron: "35 7 * * 1-5"
    # 15:10 VN
    - cron: "10 8 * * 1-5"
    # 16:30 VN
    - cron: "30 9 * * 1-5"
  workflow_dispatch:  # cho phép bấm chạy tay từ tab Actions trên GitHub
    inputs:
      full_refresh:
        description: "Lấy lại toàn bộ lịch sử (TradingView tối đa 5000 nến, mã lỗi chuyển sang fhsc; chậm hơn)"
        type: boolean
        default: false

# tránh 2 lần chạy cùng ghi vào CSV cùng lúc
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Cài vnstock thế hệ 6 (nguồn dự phòng fhsc)
        # Nếu không cài được thì chỉ cảnh báo: workflow vẫn chạy bằng TradingView, chỉ mất phần dự phòng.
        run: pip install -r requirements-vnstock6.txt || echo "::warning::Không cài được vnstock 6; chạy chỉ với TradingView"

      - name: Chạy script lấy dữ liệu giá cổ phiếu (TradingView)
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}      # tuỳ chọn; để trống = đăng nhập ẩn danh
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          PRICE_SOURCE: auto
          VNSTOCK_SOURCE: fhsc
          FHSC_API_KEY: ${{ secrets.FHSC_API_KEY }}
          FULL_REFRESH: ${{ inputs.full_refresh == true && '1' || '' }}
          PYTHONUNBUFFERED: "1"
          VN_RPM: "30"
        run: python fetch_data.py

      - name: Commit và push file dữ liệu + báo cáo mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gia_lich_su_rs.csv
          for f in price_source_log.json tv_exchange_map.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "Không có gì thay đổi, bỏ qua commit/push."
            exit 0
          fi

          git commit -m "Cập nhật giá RS tự động $(date +'%Y-%m-%d')"

          # GitHub thỉnh thoảng trả "Internal Server Error" khi push (thường là lỗi tạm
          # thời phía GitHub, đặc biệt với commit thay đổi nhiều dữ liệu) -> tự thử lại
          # vài lần thay vì để cả workflow fail ngay lần đầu. Có rebase lại trước mỗi lần
          # thử để phòng trường hợp có commit khác đã push lên trong lúc này.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push thành công (lần thử $i)."
              exit 0
            fi
            echo "Push thất bại (lần thử $i/5), thử lại sau $((i * 15))s..."
            sleep $((i * 15))
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Push thất bại sau 5 lần thử."
          exit 1
