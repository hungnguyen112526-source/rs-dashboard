name: Thăm dò TradingView (chạy tay)

# Chỉ ĐỌC dữ liệu và in báo cáo ra tab "Summary" của lần chạy; không commit gì.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện tối thiểu
        run: pip install pandas numpy "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git"

      - name: Thăm dò
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python probe_tv.py
