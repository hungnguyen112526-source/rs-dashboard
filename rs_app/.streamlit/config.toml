# Giao diện: sáng kiểu báo cáo tài chính (mặc định) + chế độ tối.
# Người dùng đổi bằng menu ⋮ (góc trên phải) → Settings → Theme.
[theme]
primaryColor = "#1d4ed8"
font = "sans serif"
baseRadius = "large"

[theme.light]
primaryColor = "#1d4ed8"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f2742"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e6edf7"

[client]
toolbarMode = "auto"

[browser]
gatherUsageStats = false
