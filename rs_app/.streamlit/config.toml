# Giao diện theo mẫu "lucianLabs UI": nền kem + thẻ bo tròn + điểm nhấn tím/xanh, font Pretendard.
# Người dùng đổi sáng/tối bằng menu ⋮ (góc trên phải) → Settings → Theme.
[theme]
primaryColor = "#6A57F2"
# Pretendard (hỗ trợ đủ dấu tiếng Việt); tải theo từng phần nhỏ nên nhẹ. Thiếu mạng thì dùng font hệ thống.
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css, sans-serif"
baseRadius = "large"

[theme.light]
primaryColor = "#6A57F2"
backgroundColor = "#F4F2EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16151B"

[theme.dark]
primaryColor = "#B7A4FF"
backgroundColor = "#07080D"
secondaryBackgroundColor = "#13141C"
textColor = "#F4F0E8"

[client]
toolbarMode = "auto"

[browser]
gatherUsageStats = false
