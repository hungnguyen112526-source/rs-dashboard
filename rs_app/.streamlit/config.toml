# Giao diện FinSight: bảng màu lấy từ logo (navy + xanh lục), thẻ bo 12-14px, nút bo 10px, font Pretendard.
# Người dùng đổi sáng/tối bằng menu ⋮ (góc trên phải) → Settings → Theme.
[theme]
primaryColor = "#14305A"
# Pretendard (hỗ trợ đủ dấu tiếng Việt); tải theo từng phần nhỏ nên nhẹ. Thiếu mạng thì dùng font hệ thống.
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css, sans-serif"
baseRadius = "medium"

[theme.light]
primaryColor = "#14305A"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10223F"

[theme.dark]
primaryColor = "#6C9BE8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2C"
textColor = "#E8EDF5"

[client]
toolbarMode = "auto"

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
