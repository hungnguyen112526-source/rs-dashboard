<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple Night</title>
<style>
html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
/* luật .temple-night-* lấy nguyên từ threeui.css */
.temple-night-scene,.temple-night-canvas{display:block;width:100%;height:100%}
.temple-night-scene{position:relative;overflow:hidden;background:#05070a}
.temple-night-canvas{position:relative;z-index:1;opacity:0;touch-action:none}
.temple-night-canvas.is-ready{opacity:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js"}}</script>
<div class="temple-night-scene" id="host"><canvas class="temple-night-canvas" id="cv"></canvas></div>
<script type="module">
/* Vòng đời chuyển từ TempleNightScene.tsx sang JS thuần; renderer giữ nguyên, không sửa. */
import { createTempleNightRenderer } from "./templeNightRenderer.js";
const host = document.getElementById("host"), canvas = document.getElementById("cv");
let r;
try { r = createTempleNightRenderer(canvas); } catch (e) { console.error(e); r = null; }
if (r) {
  let frame = 0, visible = true, ready = false;
  const schedule = () => { if (visible && !document.hidden && !frame) frame = requestAnimationFrame(render); };
  const render = (t) => { frame = 0; r.render(t);
    if (!ready) { ready = true; canvas.classList.add("is-ready"); }
    if (!r.reducedMotion) schedule(); };
  const resize = () => { r.resize(); schedule(); };
  new ResizeObserver(resize).observe(host);
  new IntersectionObserver(([e]) => { visible = e ? e.isIntersecting : true; schedule(); }).observe(host);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; } else schedule(); });
  /* trang cha gửi toạ độ chuột vì khung này nằm sau nội dung */
  addEventListener("message", (m) => {
    const d = m.data; if (!d || d.tn !== 1) return;
    r.setPointer(d.x, d.y, d.inside); schedule(); });
  resize();
}
</script>
